<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2631">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/>
    </marker>
  </defs>

  <!-- Row labels -->
  <text x="10" y="24" font-weight="bold" fill="#1f4e79">At build time</text>
  <text x="10" y="194" font-weight="bold" fill="#1e8449">At run time</text>
  <line x1="10" y1="172" x2="770" y2="172" stroke="#d5d8dc" stroke-width="1.5"/>

  <!-- DTS -->
  <rect x="10" y="36" width="230" height="116" rx="10" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
  <text x="125" y="58" text-anchor="middle" font-weight="bold">Board Devicetree (.dts)</text>
  <text x="22" y="84" font-family="monospace" font-size="12">led0 = &amp;red_led;</text>
  <text x="22" y="106" font-family="monospace" font-size="12">red_led: led_0 {</text>
  <text x="36" y="124" font-family="monospace" font-size="12">gpios = &lt;&amp;gpio3 12</text>
  <text x="50" y="142" font-family="monospace" font-size="12">GPIO_ACTIVE_LOW&gt;;</text>

  <line x1="240" y1="94" x2="278" y2="94" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- C code -->
  <rect x="280" y="36" width="230" height="116" rx="10" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
  <text x="395" y="58" text-anchor="middle" font-weight="bold">Your C code (main.c)</text>
  <text x="292" y="88" font-family="monospace" font-size="12">GPIO_DT_SPEC_GET(</text>
  <text x="306" y="106" font-family="monospace" font-size="12">DT_ALIAS(led0),</text>
  <text x="306" y="124" font-family="monospace" font-size="12">gpios)</text>

  <line x1="510" y1="94" x2="548" y2="94" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- gpio_dt_spec -->
  <rect x="550" y="36" width="220" height="116" rx="10" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
  <text x="660" y="58" text-anchor="middle" font-weight="bold" font-family="monospace" font-size="13">struct gpio_dt_spec led</text>
  <text x="562" y="88" font-family="monospace" font-size="12">.port     = gpio3</text>
  <text x="562" y="106" font-family="monospace" font-size="12">.pin      = 12</text>
  <text x="562" y="124" font-family="monospace" font-size="12">.dt_flags = ACTIVE_LOW</text>

  <!-- Down to run time -->
  <path d="M660,152 L660,180 L125,180 L125,206" fill="none" stroke="#566573" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- main -->
  <rect x="10" y="208" width="230" height="100" rx="10" fill="#e8f6ef" stroke="#1e8449" stroke-width="2"/>
  <text x="125" y="232" text-anchor="middle" font-weight="bold">main()</text>
  <text x="125" y="260" text-anchor="middle" font-family="monospace" font-size="12">gpio_pin_toggle_dt(&amp;led)</text>
  <text x="125" y="282" text-anchor="middle" font-family="monospace" font-size="12">k_msleep(SLEEP_TIME_MS)</text>

  <line x1="240" y1="258" x2="278" y2="258" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- driver -->
  <rect x="280" y="208" width="230" height="100" rx="10" fill="#e8f6ef" stroke="#1e8449" stroke-width="2"/>
  <text x="395" y="232" text-anchor="middle" font-weight="bold">GPIO driver</text>
  <text x="395" y="258" text-anchor="middle" font-size="13">device gpio3</text>
  <text x="395" y="280" text-anchor="middle" font-size="12" fill="#566573">initialized at boot, before main()</text>

  <line x1="510" y1="258" x2="548" y2="258" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- pin + LED -->
  <rect x="550" y="208" width="220" height="100" rx="10" fill="#f8f9f9" stroke="#566573" stroke-width="2"/>
  <text x="630" y="232" text-anchor="middle" font-weight="bold">Pin P3_12</text>
  <text x="630" y="258" text-anchor="middle" font-size="13">low = LED on</text>
  <text x="630" y="280" text-anchor="middle" font-size="12" fill="#566573">(active low)</text>
  <circle cx="730" cy="258" r="18" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
</svg>
