<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2631">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/>
    </marker>
  </defs>

  <!-- Step markers -->
  <g font-size="12" font-weight="bold" fill="#ffffff">
    <circle cx="190" cy="24" r="11" fill="#1f4e79"/><text x="190" y="28" text-anchor="middle">1</text>
    <circle cx="330" cy="24" r="11" fill="#1f4e79"/><text x="330" y="28" text-anchor="middle">2</text>
    <circle cx="500" cy="24" r="11" fill="#1f4e79"/><text x="500" y="28" text-anchor="middle">3</text>
    <circle cx="660" cy="24" r="11" fill="#1f4e79"/><text x="660" y="28" text-anchor="middle">4</text>
  </g>

  <!-- Phase separators -->
  <g stroke="#aab7b8" stroke-dasharray="4,4">
    <line x1="250" y1="40" x2="250" y2="270"/>
    <line x1="420" y1="40" x2="420" y2="270"/>
    <line x1="590" y1="40" x2="590" y2="270"/>
  </g>

  <!-- Lane labels -->
  <g font-weight="bold" font-size="13">
    <text x="12" y="70">main</text>
    <text x="12" y="130">worker</text>
    <text x="12" y="190">heartbeat</text>
    <text x="12" y="250" fill="#566573">idle</text>
  </g>
  <g font-size="11" fill="#566573" font-family="monospace">
    <text x="12" y="85">prio 0</text>
    <text x="12" y="145">prio 5</text>
    <text x="12" y="205">prio 7</text>
    <text x="12" y="265">lowest</text>
  </g>

  <!-- Lane baselines (waiting / not started) -->
  <g stroke="#d5d8dc" stroke-width="4">
    <line x1="130" y1="68" x2="760" y2="68"/>
    <line x1="130" y1="128" x2="760" y2="128"/>
    <line x1="130" y1="188" x2="760" y2="188"/>
    <line x1="130" y1="248" x2="760" y2="248"/>
  </g>

  <!-- main lane -->
  <rect x="130" y="54" width="120" height="28" rx="4" fill="#2ecc71" stroke="#1e8449"/>
  <text x="190" y="73" text-anchor="middle" font-size="12">boot, drivers</text>
  <rect x="250" y="54" width="170" height="28" rx="4" fill="#2ecc71" stroke="#1e8449"/>
  <text x="335" y="73" text-anchor="middle" font-size="12">main(): GPIO setup</text>
  <text x="430" y="73" font-size="12" fill="#566573">returns, ends</text>

  <!-- worker lane -->
  <text x="190" y="122" text-anchor="middle" font-size="11" fill="#808b96">not started</text>
  <rect x="250" y="114" width="170" height="28" rx="4" fill="#ffffff" stroke="#1e8449" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="335" y="133" text-anchor="middle" font-size="12">ready, waits for main</text>
  <rect x="420" y="114" width="45" height="28" rx="4" fill="#2ecc71" stroke="#1e8449"/>
  <text x="475" y="122" font-size="11" font-family="monospace">k_msgq_get()</text>
  <text x="475" y="138" font-size="11" fill="#566573">waits for a message</text>

  <!-- heartbeat lane -->
  <text x="190" y="182" text-anchor="middle" font-size="11" fill="#808b96">not started</text>
  <rect x="250" y="174" width="215" height="28" rx="4" fill="#ffffff" stroke="#1e8449" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="357" y="193" text-anchor="middle" font-size="12">ready, waits</text>
  <rect x="465" y="174" width="50" height="28" rx="4" fill="#2ecc71" stroke="#1e8449"/>
  <text x="525" y="182" font-size="11" font-family="monospace">k_msleep(1000)</text>
  <text x="525" y="198" font-size="11" fill="#566573">sleeps 1 s</text>

  <!-- idle lane -->
  <rect x="590" y="234" width="170" height="28" rx="4" fill="#d5d8dc" stroke="#808b96"/>
  <text x="675" y="253" text-anchor="middle" font-size="12" fill="#1b2631">idle runs</text>

  <!-- Interrupt enabled marker -->
  <line x1="405" y1="40" x2="405" y2="54" stroke="#b9770e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="38" text-anchor="end" font-size="11" fill="#b9770e">button interrupt enabled</text>

  <!-- Time arrow -->
  <line x1="130" y1="285" x2="760" y2="285" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="302" text-anchor="end" font-size="12" fill="#566573">time (not to scale, a few ms in total)</text>

  <!-- Step captions -->
  <g font-size="12">
    <text x="20" y="330"><tspan font-weight="bold">1</tspan>  Zephyr boots in the main thread and prints the banner.</text>
    <text x="20" y="348"><tspan font-weight="bold">2</tspan>  worker and heartbeat are now ready, but main has the higher priority and runs first.</text>
    <text x="20" y="366"><tspan font-weight="bold">3</tspan>  main returns. worker runs and waits on the queue, then heartbeat runs and sleeps.</text>
    <text x="20" y="384"><tspan font-weight="bold">4</tspan>  No thread is ready: the CPU runs the idle thread until an interrupt or a timeout.</text>
  </g>

  <!-- Legend -->
  <g font-size="11">
    <rect x="610" y="306" width="18" height="10" fill="#2ecc71" stroke="#1e8449"/><text x="634" y="315">running</text>
    <rect x="690" y="306" width="18" height="10" fill="#ffffff" stroke="#1e8449" stroke-dasharray="3,2"/><text x="714" y="315">ready</text>
  </g>
</svg>
