<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2631">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/>
    </marker>
  </defs>

  <!-- Scale: x = 130 + t_ms * 0.25 (0 .. 2500 ms) -->

  <!-- Lane labels -->
  <g font-weight="bold" font-size="13">
    <text x="12" y="40" fill="#b9770e">ISR</text>
    <text x="12" y="95">worker</text>
    <text x="12" y="150">heartbeat</text>
    <text x="12" y="205" fill="#566573">idle</text>
  </g>
  <g font-size="11" fill="#566573" font-family="monospace">
    <text x="12" y="110">prio 5</text>
    <text x="12" y="165">prio 7</text>
    <text x="12" y="220">lowest</text>
  </g>

  <!-- Baselines -->
  <g stroke="#d5d8dc" stroke-width="4">
    <line x1="130" y1="36" x2="755" y2="36"/>
    <line x1="130" y1="91" x2="755" y2="91"/>
    <line x1="130" y1="146" x2="755" y2="146"/>
  </g>

  <!-- idle: runs whenever nobody else does (drawn as one band, others on top) -->
  <rect x="130" y="188" width="625" height="22" fill="#d5d8dc"/>
  <!-- gaps in idle where a thread or the ISR runs -->
  <g fill="#ffffff">
    <rect x="379" y="188" width="6" height="22"/>
    <rect x="455" y="188" width="14" height="22"/>
    <rect x="629" y="188" width="6" height="22"/>
  </g>

  <!-- heartbeat: wakes at 1000 ms and 2000 ms, runs very briefly -->
  <rect x="379" y="133" width="6" height="26" fill="#2ecc71" stroke="#1e8449"/>
  <rect x="629" y="133" width="6" height="26" fill="#2ecc71" stroke="#1e8449"/>
  <text x="382" y="128" text-anchor="middle" font-size="11">toggle green LED</text>
  <text x="632" y="128" text-anchor="middle" font-size="11">toggle green LED</text>

  <!-- Button press at 1300 ms -->
  <line x1="455" y1="8" x2="455" y2="22" stroke="#b9770e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="16" font-size="11" fill="#b9770e">SW2 pressed</text>
  <rect x="455" y="24" width="4" height="24" fill="#f5b041" stroke="#b9770e"/>
  <text x="466" y="44" font-size="11">k_msgq_put()</text>

  <!-- worker: becomes ready right after the ISR and runs -->
  <path d="M459,48 L463,78" stroke="#1f4e79" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="459" y="78" width="10" height="26" fill="#2ecc71" stroke="#1e8449"/>
  <text x="476" y="88" font-size="11">gets the message, toggles red LED,</text>
  <text x="476" y="102" font-size="11">printk(), back to k_msgq_get()</text>

  <!-- Time axis -->
  <line x1="130" y1="232" x2="760" y2="232" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-size="11" fill="#566573" text-anchor="middle">
    <line x1="130" y1="228" x2="130" y2="236" stroke="#566573"/><text x="130" y="250">0 s</text>
    <line x1="255" y1="228" x2="255" y2="236" stroke="#566573"/><text x="255" y="250">0.5 s</text>
    <line x1="380" y1="228" x2="380" y2="236" stroke="#566573"/><text x="380" y="250">1 s</text>
    <line x1="505" y1="228" x2="505" y2="236" stroke="#566573"/><text x="505" y="250">1.5 s</text>
    <line x1="630" y1="228" x2="630" y2="236" stroke="#566573"/><text x="630" y="250">2 s</text>
  </g>

  <!-- Caption -->
  <text x="20" y="278" font-size="12">Most of the time no thread is ready, and the CPU is in the idle thread. A thread runs only when its</text>
  <text x="20" y="295" font-size="12">event comes: the 1 s timeout of <tspan font-family="monospace">k_msleep()</tspan>, or a message in the queue. Run times are exaggerated.</text>
</svg>
