<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2631">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/>
    </marker>
  </defs>

  <!-- PC -->
  <rect x="20" y="100" width="170" height="140" rx="10" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
  <text x="105" y="128" text-anchor="middle" font-weight="bold" font-size="16">Your PC</text>
  <text x="105" y="158" text-anchor="middle">west build</text>
  <text x="105" y="180" text-anchor="middle">west flash</text>
  <text x="105" y="202" text-anchor="middle">serial terminal</text>
  <text x="105" y="222" text-anchor="middle" font-size="12" fill="#566573">(PuTTY / minicom)</text>

  <!-- USB cable -->
  <line x1="190" y1="170" x2="280" y2="170" stroke="#1f4e79" stroke-width="5" stroke-linecap="round"/>
  <text x="235" y="158" text-anchor="middle" font-weight="bold">USB-C</text>
  <text x="235" y="192" text-anchor="middle" font-size="12" fill="#566573">power</text>
  <text x="235" y="207" text-anchor="middle" font-size="12" fill="#566573">flash</text>
  <text x="235" y="222" text-anchor="middle" font-size="12" fill="#566573">console</text>

  <!-- Board -->
  <rect x="280" y="20" width="460" height="315" rx="14" fill="#f8f9f9" stroke="#566573" stroke-width="2"/>
  <text x="300" y="46" font-weight="bold" font-size="16">FRDM-MCXA156 board</text>

  <!-- MCU-Link -->
  <rect x="300" y="100" width="150" height="140" rx="10" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
  <text x="375" y="128" text-anchor="middle" font-weight="bold">MCU-Link</text>
  <text x="375" y="152" text-anchor="middle" font-size="13">on-board debug probe</text>
  <text x="375" y="174" text-anchor="middle" font-size="13">USB port J21</text>

  <!-- MCU -->
  <rect x="560" y="100" width="160" height="140" rx="10" fill="#e8f6ef" stroke="#1e8449" stroke-width="2"/>
  <text x="640" y="128" text-anchor="middle" font-weight="bold">MCXA156</text>
  <text x="640" y="152" text-anchor="middle" font-size="13">microcontroller</text>
  <text x="640" y="174" text-anchor="middle" font-size="13">runs Zephyr and</text>
  <text x="640" y="192" text-anchor="middle" font-size="13">your application</text>

  <!-- links MCU-Link <-> MCU -->
  <line x1="450" y1="140" x2="558" y2="140" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="504" y="132" text-anchor="middle" font-size="12">SWD: flash</text>
  <line x1="560" y1="200" x2="452" y2="200" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="504" y="192" text-anchor="middle" font-size="12">UART: console</text>
  <text x="504" y="216" text-anchor="middle" font-size="11" fill="#566573">115200 baud</text>

  <!-- GPIO lines -->
  <line x1="600" y1="240" x2="420" y2="268" stroke="#566573" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="640" y1="240" x2="580" y2="266" stroke="#566573" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="680" y1="240" x2="680" y2="266" stroke="#566573" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="690" y="257" font-size="11" fill="#566573">GPIO</text>

  <!-- RGB LED -->
  <circle cx="380" cy="282" r="11" fill="#e74c3c" stroke="#922b21"/>
  <circle cx="406" cy="282" r="11" fill="#2ecc71" stroke="#1d8348"/>
  <circle cx="432" cy="282" r="11" fill="#3498db" stroke="#1f618d"/>
  <text x="406" y="312" text-anchor="middle" font-size="13">RGB LED</text>
  <text x="406" y="328" text-anchor="middle" font-size="11" fill="#566573">led0 red · led1 green · led2 blue</text>

  <!-- Buttons -->
  <rect x="550" y="266" width="60" height="32" rx="6" fill="#d5d8dc" stroke="#566573"/>
  <text x="580" y="287" text-anchor="middle" font-weight="bold" font-size="13">SW2</text>
  <text x="580" y="318" text-anchor="middle" font-size="12" fill="#566573">sw0</text>
  <rect x="650" y="266" width="60" height="32" rx="6" fill="#d5d8dc" stroke="#566573"/>
  <text x="680" y="287" text-anchor="middle" font-weight="bold" font-size="13">SW3</text>
  <text x="680" y="318" text-anchor="middle" font-size="12" fill="#566573">sw1</text>
</svg>
