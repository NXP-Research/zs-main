<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2631">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/>
    </marker>
  </defs>

  <!-- Start -->
  <circle cx="22" cy="180" r="7" fill="#1b2631"/>
  <line x1="29" y1="180" x2="48" y2="180" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- States -->
  <rect x="50" y="145" width="150" height="70" rx="35" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
  <text x="125" y="176" text-anchor="middle" font-weight="bold" font-family="monospace" font-size="13">STATE_IDLE</text>
  <text x="125" y="196" text-anchor="middle" font-size="12" fill="#566573">LED off</text>

  <rect x="315" y="145" width="150" height="70" rx="35" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
  <text x="390" y="176" text-anchor="middle" font-weight="bold" font-family="monospace" font-size="13">STATE_WAITING</text>
  <text x="390" y="196" text-anchor="middle" font-size="12" fill="#566573">random delay</text>

  <rect x="580" y="145" width="150" height="70" rx="35" fill="#fdedec" stroke="#922b21" stroke-width="2"/>
  <text x="655" y="176" text-anchor="middle" font-weight="bold" font-family="monospace" font-size="13">STATE_REACT</text>
  <text x="655" y="196" text-anchor="middle" font-size="12" fill="#566573">LED on, timing</text>
  <circle cx="742" cy="148" r="9" fill="#e74c3c" stroke="#922b21"/>

  <!-- IDLE -> WAITING -->
  <line x1="200" y1="180" x2="313" y2="180" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="257" y="170" text-anchor="middle" font-weight="bold" font-size="13">press</text>
  <text x="257" y="200" text-anchor="middle" font-size="12">pick a delay</text>

  <!-- WAITING -> REACT -->
  <line x1="465" y1="180" x2="578" y2="180" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="522" y="170" text-anchor="middle" font-weight="bold" font-size="13">delay expired</text>
  <text x="522" y="200" text-anchor="middle" font-size="12">LED on, save time</text>

  <!-- WAITING -> IDLE (top) -->
  <path d="M390,145 C390,50 125,50 125,143" fill="none" stroke="#b9770e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="257" y="34" text-anchor="middle" font-weight="bold" font-size="13">press</text>
  <text x="257" y="52" text-anchor="middle" font-size="12">"Too early!"</text>

  <!-- REACT -> IDLE (bottom) -->
  <path d="M655,215 C655,335 125,335 125,217" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="334" text-anchor="middle" font-size="13">press → LED off, print the reaction time</text>
  <text x="390" y="354" text-anchor="middle" font-size="13">REACT_TIMEOUT_MS expired → LED off, "Too slow!"</text>
</svg>
