<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2631">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/>
    </marker>
  </defs>

  <!-- Phase labels -->
  <g font-size="12" font-weight="bold" fill="#566573" text-anchor="middle">
    <text x="224" y="18">press: bounce</text>
    <text x="385" y="18">held down</text>
    <text x="533" y="18">release: bounce</text>
  </g>

  <!-- Level labels -->
  <text x="12" y="64" font-size="12" font-weight="bold">pressed</text>
  <text x="12" y="114" font-size="12" font-weight="bold">released</text>
  <text x="12" y="80" font-size="10" fill="#566573">(gpio_pin_get_dt() == 1)</text>

  <!-- Button signal -->
  <polyline fill="none" stroke="#1f4e79" stroke-width="3"
    points="130,110 200,110 200,60 215,60 215,110 228,110 228,60 238,60 238,110 248,110 248,60
            360,60 360,60"/>
  <!-- break in the held phase: long time, not to scale -->
  <polyline fill="none" stroke="#1f4e79" stroke-width="3" points="410,60 520,60 520,110 533,110 533,60 545,60 545,110 750,110"/>
  <g stroke="#566573" stroke-width="1.5">
    <line x1="378" y1="70" x2="388" y2="50"/>
    <line x1="388" y1="70" x2="398" y2="50"/>
  </g>
  <line x1="360" y1="60" x2="378" y2="60" stroke="#1f4e79" stroke-width="3"/>
  <line x1="398" y1="60" x2="410" y2="60" stroke="#1f4e79" stroke-width="3"/>
  <text x="388" y="90" text-anchor="middle" font-size="11" fill="#566573">for example 1 s</text>

  <!-- Edge markers (numbered) -->
  <g font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="200" cy="135" r="9" fill="#1e8449"/><text x="200" y="139">1</text>
    <circle cx="215" cy="155" r="9" fill="#922b21"/><text x="215" y="159">2</text>
    <circle cx="228" cy="135" r="9" fill="#922b21"/><text x="228" y="139">3</text>
    <circle cx="238" cy="155" r="9" fill="#922b21"/><text x="238" y="159">4</text>
    <circle cx="248" cy="135" r="9" fill="#922b21"/><text x="248" y="139">5</text>
    <circle cx="520" cy="135" r="9" fill="#922b21"/><text x="520" y="139">6</text>
    <circle cx="533" cy="155" r="9" fill="#922b21"/><text x="533" y="159">7</text>
    <circle cx="545" cy="135" r="9" fill="#922b21"/><text x="545" y="139">8</text>
  </g>
  <g stroke="#aab7b8" stroke-dasharray="2,3">
    <line x1="200" y1="110" x2="200" y2="126"/>
    <line x1="215" y1="110" x2="215" y2="146"/>
    <line x1="228" y1="110" x2="228" y2="126"/>
    <line x1="238" y1="110" x2="238" y2="146"/>
    <line x1="248" y1="110" x2="248" y2="126"/>
    <line x1="520" y1="110" x2="520" y2="126"/>
    <line x1="533" y1="110" x2="533" y2="146"/>
    <line x1="545" y1="110" x2="545" y2="126"/>
  </g>

  <!-- Quiet-time windows: 50 ms after the last edge -->
  <rect x="248" y="172" width="70" height="14" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="283" y="183" text-anchor="middle" font-size="10">50 ms</text>
  <rect x="545" y="172" width="70" height="14" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="580" y="183" text-anchor="middle" font-size="10">50 ms</text>
  <text x="430" y="203" text-anchor="middle" font-size="11" fill="#566573">the 50 ms quiet time restarts at every edge</text>

  <!-- Table -->
  <g font-size="11">
    <text x="12" y="222" font-weight="bold">edge</text>
    <text x="12" y="244" font-weight="bold">quiet for 50 ms?</text>
    <text x="12" y="266" font-weight="bold">pin reads</text>
    <text x="12" y="288" font-weight="bold">result</text>
  </g>
  <line x1="12" y1="229" x2="770" y2="229" stroke="#d5d8dc"/>
  <g font-size="11" text-anchor="middle">
    <!-- columns at x = 160 + i*80 -->
    <text x="160" y="222" font-weight="bold">1</text>
    <text x="160" y="244">yes</text><text x="160" y="266">pressed</text>
    <text x="160" y="288" font-weight="bold" fill="#1e8449">PRESS</text>

    <text x="240" y="222" font-weight="bold">2</text>
    <text x="240" y="244" fill="#922b21">no</text><text x="240" y="266">released</text>
    <text x="240" y="288" fill="#922b21">ignore</text>

    <text x="320" y="222" font-weight="bold">3</text>
    <text x="320" y="244" fill="#922b21">no</text><text x="320" y="266">pressed</text>
    <text x="320" y="288" fill="#922b21">ignore</text>

    <text x="400" y="222" font-weight="bold">4</text>
    <text x="400" y="244" fill="#922b21">no</text><text x="400" y="266">released</text>
    <text x="400" y="288" fill="#922b21">ignore</text>

    <text x="480" y="222" font-weight="bold">5</text>
    <text x="480" y="244" fill="#922b21">no</text><text x="480" y="266">pressed</text>
    <text x="480" y="288" fill="#922b21">ignore</text>

    <text x="560" y="222" font-weight="bold">6</text>
    <text x="560" y="244">yes</text><text x="560" y="266" fill="#922b21">released</text>
    <text x="560" y="288" fill="#922b21">ignore</text>

    <text x="640" y="222" font-weight="bold">7</text>
    <text x="640" y="244" fill="#922b21">no</text><text x="640" y="266">pressed</text>
    <text x="640" y="288" fill="#922b21">ignore</text>

    <text x="720" y="222" font-weight="bold">8</text>
    <text x="720" y="244" fill="#922b21">no</text><text x="720" y="266">released</text>
    <text x="720" y="288" fill="#922b21">ignore</text>
  </g>

  <!-- Why edge 7 matters -->
  <rect x="440" y="306" width="330" height="54" rx="8" fill="#fdedec" stroke="#922b21"/>
  <text x="452" y="326" font-size="12">Edge 7 is the dangerous one: it looks like a press,</text>
  <text x="452" y="344" font-size="12">long after the last accepted press. Only the</text>
  <text x="452" y="358" font-size="12">"quiet since the <tspan font-weight="bold">last edge</tspan>" rule drops it.</text>

  <!-- Caption -->
  <text x="12" y="326" font-size="12">One press, eight interrupt edges.</text>
  <text x="12" y="344" font-size="12">A press counts only if the button was quiet</text>
  <text x="12" y="362" font-size="12">for 50 ms <tspan font-weight="bold">and</tspan> the pin reads pressed.</text>
  <text x="12" y="390" font-size="11" fill="#566573">Not to scale: each bounce lasts well under a millisecond, the whole bounce a few ms.</text>
</svg>
