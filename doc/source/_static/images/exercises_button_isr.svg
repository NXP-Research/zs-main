<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2631">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/>
    </marker>
  </defs>

  <!-- Button -->
  <rect x="10" y="50" width="130" height="90" rx="10" fill="#f8f9f9" stroke="#566573" stroke-width="2"/>
  <rect x="45" y="68" width="60" height="30" rx="6" fill="#d5d8dc" stroke="#566573"/>
  <text x="75" y="88" text-anchor="middle" font-weight="bold" font-size="13">SW2</text>
  <text x="75" y="124" text-anchor="middle" font-size="13">you press it</text>

  <line x1="140" y1="95" x2="188" y2="95" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="164" y="84" text-anchor="middle" font-size="12">edge</text>

  <!-- GPIO controller -->
  <rect x="190" y="50" width="150" height="90" rx="10" fill="#f8f9f9" stroke="#566573" stroke-width="2"/>
  <text x="265" y="78" text-anchor="middle" font-weight="bold">GPIO hardware</text>
  <text x="265" y="102" text-anchor="middle" font-size="13">detects the edge,</text>
  <text x="265" y="120" text-anchor="middle" font-size="13">raises an interrupt</text>

  <line x1="340" y1="95" x2="388" y2="95" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="364" y="84" text-anchor="middle" font-size="12">IRQ</text>

  <!-- ISR callback -->
  <rect x="390" y="30" width="220" height="130" rx="10" fill="#fdebd0" stroke="#b9770e" stroke-width="2"/>
  <text x="500" y="54" text-anchor="middle" font-weight="bold" font-family="monospace" font-size="13">button_pressed()</text>
  <text x="500" y="76" text-anchor="middle" font-size="12" fill="#b9770e" font-weight="bold">runs in ISR context</text>
  <text x="500" y="102" text-anchor="middle" font-family="monospace" font-size="12">gpio_pin_toggle_dt(&amp;led)</text>
  <text x="500" y="122" text-anchor="middle" font-family="monospace" font-size="12">printk(...)</text>
  <text x="500" y="146" text-anchor="middle" font-size="12">short · never block</text>

  <line x1="610" y1="95" x2="668" y2="95" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LED -->
  <rect x="670" y="50" width="100" height="90" rx="10" fill="#f8f9f9" stroke="#566573" stroke-width="2"/>
  <circle cx="720" cy="84" r="16" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
  <text x="720" y="126" text-anchor="middle" font-size="13">red LED</text>

  <!-- main(): setup -->
  <rect x="190" y="200" width="420" height="80" rx="10" fill="#e8f6ef" stroke="#1e8449" stroke-width="2"/>
  <text x="400" y="224" text-anchor="middle" font-weight="bold">main(), once at start-up</text>
  <text x="400" y="248" text-anchor="middle" font-size="13">configure pins · enable the interrupt · register the callback</text>
  <text x="400" y="268" text-anchor="middle" font-size="13">then return: the interrupt keeps working</text>

  <line x1="265" y1="200" x2="265" y2="142" stroke="#566573" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="500" y1="200" x2="500" y2="162" stroke="#566573" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="275" y="180" font-size="12" fill="#566573">configures</text>
  <text x="510" y="186" font-size="12" fill="#566573">registers</text>
</svg>
