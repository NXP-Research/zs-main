<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2631">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/>
    </marker>
  </defs>

  <!-- Context areas -->
  <rect x="100" y="10" width="190" height="300" rx="12" fill="#fef5e7" stroke="none"/>
  <text x="195" y="32" text-anchor="middle" font-weight="bold" fill="#b9770e">Interrupt context</text>
  <rect x="460" y="10" width="200" height="300" rx="12" fill="#eafaf1" stroke="none"/>
  <text x="560" y="32" text-anchor="middle" font-weight="bold" fill="#1e8449">Thread context</text>

  <!-- Button -->
  <rect x="10" y="80" width="70" height="40" rx="6" fill="#d5d8dc" stroke="#566573"/>
  <text x="45" y="105" text-anchor="middle" font-weight="bold" font-size="13">SW2</text>
  <line x1="80" y1="100" x2="118" y2="100" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="45" y="140" text-anchor="middle" font-size="11" fill="#566573">every edge:</text>
  <text x="45" y="154" text-anchor="middle" font-size="11" fill="#566573">press and</text>
  <text x="45" y="168" text-anchor="middle" font-size="11" fill="#566573">release</text>

  <!-- ISR -->
  <rect x="120" y="50" width="150" height="100" rx="10" fill="#fdebd0" stroke="#b9770e" stroke-width="2"/>
  <text x="195" y="74" text-anchor="middle" font-weight="bold">ISR</text>
  <text x="195" y="96" text-anchor="middle" font-size="12">record time + pressed,</text>
  <text x="195" y="114" text-anchor="middle" font-size="12">send it, don't wait</text>
  <text x="195" y="136" text-anchor="middle" font-family="monospace" font-size="11">K_NO_WAIT</text>

  <line x1="270" y1="100" x2="308" y2="100" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="289" y="90" text-anchor="middle" font-size="11">put</text>

  <!-- Queue -->
  <rect x="310" y="60" width="130" height="80" rx="10" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
  <text x="375" y="80" text-anchor="middle" font-weight="bold" font-size="13">message queue</text>
  <rect x="322" y="92" width="22" height="30" fill="#aed6f1" stroke="#1f4e79"/>
  <rect x="348" y="92" width="22" height="30" fill="#aed6f1" stroke="#1f4e79"/>
  <rect x="374" y="92" width="22" height="30" fill="#ffffff" stroke="#1f4e79"/>
  <rect x="400" y="92" width="22" height="30" fill="#ffffff" stroke="#1f4e79"/>
  <text x="375" y="160" text-anchor="middle" font-family="monospace" font-size="11">button_msgq</text>

  <line x1="440" y1="100" x2="478" y2="100" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="459" y="90" text-anchor="middle" font-size="11">get</text>

  <!-- Worker -->
  <rect x="480" y="50" width="160" height="100" rx="10" fill="#e8f6ef" stroke="#1e8449" stroke-width="2"/>
  <text x="560" y="74" text-anchor="middle" font-weight="bold">worker thread</text>
  <text x="560" y="92" text-anchor="middle" font-size="12" fill="#566573">priority 5</text>
  <text x="560" y="114" text-anchor="middle" font-size="12">sleeps until a message,</text>
  <text x="560" y="128" text-anchor="middle" font-size="11" fill="#566573">ignores releases and bounce</text>
  <text x="560" y="144" text-anchor="middle" font-family="monospace" font-size="11">K_FOREVER</text>

  <line x1="640" y1="100" x2="698" y2="100" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="725" cy="100" r="18" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
  <text x="725" y="138" text-anchor="middle" font-size="12">red LED</text>

  <!-- Heartbeat -->
  <rect x="480" y="200" width="160" height="90" rx="10" fill="#e8f6ef" stroke="#1e8449" stroke-width="2"/>
  <text x="560" y="224" text-anchor="middle" font-weight="bold">heartbeat thread</text>
  <text x="560" y="242" text-anchor="middle" font-size="12" fill="#566573">priority 7</text>
  <text x="560" y="266" text-anchor="middle" font-size="12">toggle, sleep 1 s, repeat</text>

  <line x1="640" y1="245" x2="698" y2="245" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="725" cy="245" r="18" fill="#2ecc71" stroke="#1d8348" stroke-width="2"/>
  <text x="725" y="283" text-anchor="middle" font-size="12">green LED</text>

  <!-- Note -->
  <text x="195" y="250" text-anchor="middle" font-size="12" fill="#566573">fast: just hands over</text>
  <text x="195" y="268" text-anchor="middle" font-size="12" fill="#566573">the event</text>
</svg>
